      }
    }
  },
  "secrets": {
    "anthropic-alpha-control": {
      "file": "${AI_ENV_ROOT:?Run prepare.py first}/anthropic-alpha/secrets/control-token"
    },
    "anthropic-bravo-control": {
      "file": "${AI_ENV_ROOT:?Run prepare.py first}/anthropic-bravo/secrets/control-token"
    },
    "openai-alpha-control": {
      "file": "${AI_ENV_ROOT:?Run prepare.py first}/openai-alpha/secrets/control-token"
    },
    "openai-bravo-control": {
      "file": "${AI_ENV_ROOT:?Run prepare.py first}/openai-bravo/secrets/control-token"
    }
  },
  "networks": {
    "anthropic-alpha": {},
    "anthropic-bravo": {},
    "openai-alpha": {},
    "openai-bravo": {}
  }
}
