# The repository's check on every pull request. No secrets, no deploy. The job name `check` is
# the required status in github/ruleset-main.json.
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check
        env:
          HYGIENE_BASE: ${{ github.event.pull_request.base.sha }}
