# Nondeploying review lane: pull requests into develop and main. No push trigger, no dispatch,
# no secrets, no deploy. The job names `test` and `verify-build` are the required checks in the
# branch rulesets. Every command of the package.json `check` script runs as its own step so each
# required check stays a distinct status.
name: checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Commit and source hygiene
        env:
          HYGIENE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run check:hygiene

      - name: Tests
        run: bun run test

  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Version derives
        run: bun run version
